name: رسين · نشر المنصة
# Builds the platform (raseen-app) and publishes it on GitHub Pages.
# One-time setup by the repo owner: Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches: [raseen-frontend]
    paths: ["raseen-app/**", "raseen-frontend/**", ".github/workflows/raseen-site.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: raseen-site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: raseen-app
    env:
      VITE_SUPABASE_URL: https://lbyzdnahnprbluelbvjq.supabase.co
      VITE_SUPABASE_ANON_KEY: sb_publishable_vf91Md9-Ls1YVfxdNZKXrA_fFdeAw3k
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile || bun install
      - run: bunx vite build -c .preview/vite.config.ts
      - name: Website at the root (its login opens the live platform), the React app under /app
        working-directory: .
        run: |
          mkdir -p site
          cp -r raseen-frontend/assets site/
          # interactive presentation (deck) + its PDF at /deck/
          cp -r raseen-frontend/deck site/deck
          # the page is written as a fragment (as Claude artifacts expect); a real site needs a full document,
          # otherwise the browser falls into quirks mode and smooth scrolling stops working
          { printf '<!doctype html>\n<html lang="ar" dir="rtl">\n<head>\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width,initial-scale=1">\n'; cat raseen-frontend/index.html; printf '\n</html>\n'; } > site/index.html
          cp -r raseen-app/.preview/dist site/app
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
